[tool.ruff]
line-length = 100
extend-exclude = [".claude", ".github/skills", ".github/agents", ".github/prompts"]
builtins = ["spark", "dbutils"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
